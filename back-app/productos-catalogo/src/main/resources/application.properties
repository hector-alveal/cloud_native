# Puerto del microservicio de catalogo
server.port=8081

# Conexion a la base de datos cloud (RDS u otra)
# Reemplaza host, puerto, nombre de BD, usuario y clave por los tuyos.
# TIP: no subas las credenciales reales a GitHub. Usa variables de entorno
# o un application-local.properties que este en el .gitignore.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:catalogo_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:appuser1}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# --- SOLO PARA PRUEBA LOCAL con H2, comentar/borrar antes de AWS ---
#spring.datasource.url=jdbc:h2:mem:catalogo_db
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Nombre de la app (util para logs)
spring.application.name=productos-catalogo

# Datos de la App Registration en Azure AD (guias 1.2.3 y 1.2.5)
