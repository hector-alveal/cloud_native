# Puerto del microservicio de catalogo
server.port=8081

# Conexion a la base de datos cloud (RDS u otra)
# Reemplaza host, puerto, nombre de BD, usuario y clave por los tuyos.
# TIP: no subas las credenciales reales a GitHub. Usa variables de entorno
# o un application-local.properties que este en el .gitignore.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:catalogo_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Nombre de la app (util para logs)
spring.application.name=productos-catalogo
