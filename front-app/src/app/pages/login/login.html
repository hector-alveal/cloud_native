
<section class="login-page">

    <div class="login-container">

        <div class="login-header">
            <h1>🍔 Tienda Burger</h1>
            <h2>Iniciar Sesión</h2>
            <p>Ingresa a tu cuenta para continuar</p>
        </div>

        <form (ngSubmit)="onSubmit()">

            <div class="form-group">

                <label for="username">
                    Usuario
                </label>

                <input
                    id="username"
                    type="text"
                    [(ngModel)]="username"
                    name="username"
                    placeholder="Ingresa tu usuario"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Contraseña
                </label>

                <input
                    id="password"
                    type="password"
                    [(ngModel)]="password"
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    required
                >

            </div>

            @if (errorMessage) {

                <p class="error">
                    {{ errorMessage }}
                </p>

            }

            <button type="submit">
                Ingresar
            </button>

        </form>

        <div class="login-footer">

            <p>
                ¿No tienes una cuenta?
                <a href="#">Registrarse</a>
            </p>

        </div>

    </div>

</section>
